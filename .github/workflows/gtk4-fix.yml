name: GTK4 CSS migration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply conservative GTK4 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('Obsidian-2/gtk-4.0/gtk.css')
          s = p.read_text(encoding='utf-8')

          # Syntax/typo fixes: these do not alter the intended theme design.
          s = s.replace('padding 10px;', 'padding: 10px;')
          s = s.replace(':backdoop:', ':backdrop:')
          s = s.replace('@@theme_accent_color', '@theme_accent_color')
          s = s.replace('border-left: 1px solid alpha(@pathbar_bdr, 0.75)\\n',
                        'border-left: 1px solid alpha(@pathbar_bdr, 0.75);\\n')

          # GTK4 removed -gtk-icon-effect. GTK documents brightness(1.2)
          # as the direct replacement for "highlight".
          s = s.replace('-gtk-icon-effect: highlight;', '-gtk-icon-filter: brightness(1.2);')
          s = s.replace('-gtk-icon-effect: dim;', '-gtk-icon-filter: opacity(0.5);')

          # GTK4 removed -gtk-outline-*-radius; ordinary border-radius remains.
          s = re.sub(r'^\\s*-gtk-outline-[^:;]+:\\s*[^;]+;\\s*\\n', '', s, flags=re.M)

          # GTK4 removed -gtk-gradient. Convert the legacy radial form to
          # standard CSS radial-gradient while retaining position, colors,
          # size, repeat and positioning from the original theme.
          pat = re.compile(
              r'-gtk-gradient\\(radial,\\s*'
              r'([^,]+),\\s*0,\\s*([^,]+),\\s*([0-9.]+),\\s*'
              r'(?:from\\(([^)]+)\\)|to\\(([^)]+)\\)),\\s*'
              r'(?:from\\(([^)]+)\\)|to\\(([^)]+)\\))\\)'
          )

          def grad(m):
              pos1, pos2, radius, a_from, a_to, b_from, b_to = m.groups()
              # Legacy GTK radial gradients use the same center twice in the
              # theme. Keep that center exactly; the legacy radius is already
              # expressed relative to the widget and background-size preserves
              # the visual extent.
              first = a_from if a_from is not None else a_to
              second = b_to if b_to is not None else b_from
              return f'radial-gradient(circle at {pos1.strip()}, {first.strip()} 0%, {second.strip()} 100%)'

          s2 = pat.sub(grad, s)
          if s2 == s and '-gtk-gradient(' in s:
              raise SystemExit('GTK4 migration failed: legacy -gtk-gradient remains but was not matched')
          s = s2

          # Nemo's GTK3-only private properties are not valid GTK4 CSS.
          s = re.sub(r'(?ms)^NemoPlacesTreeView\\s*\\{.*?^\\}', '', s)

          p.write_text(s, encoding='utf-8')
          PY

          # Show any remaining GTK3-only constructs before parser testing.
          if grep -nE -- '-gtk-(gradient|icon-effect|icon-theme|outline-)' Obsidian-2/gtk-4.0/gtk.css; then
            echo 'Legacy GTK3-only properties remain.'
            exit 1
          fi

      - name: Install GTK4 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-bin

      - name: Parse theme with GTK4
        shell: bash
        run: |
          set -o pipefail
          sudo cp -a Obsidian-2 /usr/share/themes/Obsidian-2
          set +e
          timeout 8s env GTK_THEME=Obsidian-2 gtk4-widget-factory >/tmp/gtk4.out 2>/tmp/gtk4.err
          rc=$?
          set -e
          cat /tmp/gtk4.out
          cat /tmp/gtk4.err >&2
          if grep -nE 'Theme parser error|Theme parsing error|Failed to import' /tmp/gtk4.err; then
            echo 'GTK4 theme parser reported errors.'
            exit 1
          fi
          # timeout is expected because widget-factory is interactive.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Obsidian-2/gtk-4.0/gtk.css
          git rm .github/workflows/gtk4-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: make original Obsidian-2 GTK4 CSS warning-free'
          git push
