name: GTK4 CSS migration

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply conservative GTK4 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('Obsidian-2/gtk-4.0/gtk.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('padding 10px;', 'padding: 10px;').replace(':backdoop:', ':backdrop:').replace('@@theme_accent_color','@theme_accent_color')
          s = s.replace('border-left: 1px solid alpha(@pathbar_bdr, 0.75)\n','border-left: 1px solid alpha(@pathbar_bdr, 0.75);\n')
          s = s.replace('-gtk-icon-effect: highlight;','-gtk-icon-filter: brightness(1.2);').replace('-gtk-icon-effect: dim;','-gtk-icon-filter: opacity(0.5);')
          s = re.sub(r'^\s*-gtk-outline-[^:;]+:\s*[^;]+;\s*\n','',s,flags=re.M)
          def matching(text,start):
              depth=0
              for i in range(start,len(text)):
                  if text[i]=='(': depth+=1
                  elif text[i]==')':
                      depth-=1
                      if depth==0:return i
              return -1
          def split_top(text):
              out=[]; last=depth=0
              for i,c in enumerate(text):
                  if c=='(': depth+=1
                  elif c==')': depth-=1
                  elif c==',' and depth==0: out.append(text[last:i].strip()); last=i+1
              out.append(text[last:].strip()); return out
          needle='-gtk-gradient('; out=[]; pos=0
          while True:
              st=s.find(needle,pos)
              if st<0: out.append(s[pos:]); break
              out.append(s[pos:st]); en=matching(s,st+len('-gtk-gradient'))
              if en<0: raise SystemExit('Unmatched -gtk-gradient()')
              parts=split_top(s[st+len(needle):en])
              if len(parts)>=7 and parts[0]=='radial':
                  p1=parts[1].strip()
                  def stop(x):
                      m=re.match(r'^(?:from|to)\((.*)\)$',x,re.S); return m.group(1).strip() if m else x
                  out.append(f'radial-gradient(circle at {p1}, {stop(parts[5])} 0%, {stop(parts[6])} 100%)')
              else: raise SystemExit('Unsupported legacy -gtk-gradient() form')
              pos=en+1
          s=''.join(out)
          s=re.sub(r'(?ms)^NemoPlacesTreeView(?::selected)?\s*\{.*?^\}\s*','',s)
          p.write_text(s,encoding='utf-8')
          PY
          if grep -nE -- '-gtk-(gradient|icon-effect|icon-theme|outline-)' Obsidian-2/gtk-4.0/gtk.css; then exit 1; fi

      - name: Install GTK4 test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-bin gtk-4-examples

      - name: Parse theme with GTK4
        shell: bash
        run: |
          set -o pipefail
          sudo cp -a Obsidian-2 /usr/share/themes/Obsidian-2
          set +e
          timeout 8s env GTK_THEME=Obsidian-2 gtk4-widget-factory >/tmp/gtk4.out 2>/tmp/gtk4.err
          rc=$?
          set -e
          cat /tmp/gtk4.out
          cat /tmp/gtk4.err >&2
          if grep -nE 'Theme parser error|Theme parsing error|Failed to import|CRITICAL|WARNING' /tmp/gtk4.err; then
            echo 'GTK4 parser reported warnings/errors.'
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Obsidian-2/gtk-4.0/gtk.css
          git rm .github/workflows/gtk4-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: make original Obsidian-2 GTK4 CSS warning-free'
          git push
